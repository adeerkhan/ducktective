name: Deploy site

# Pages serves only static files, so this workflow's contract is: prove the
# workspace is sound (typecheck, tests, lint), build `site/dist`, publish it as a
# Pages artifact. `SITE_BASE` must match the `/ducktective/` project-page prefix
# that site/vite.config.ts and site/src/main.tsx derive their base path from.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          SITE_BASE: /ducktective/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
